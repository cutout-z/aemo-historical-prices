name: Monthly AEMO Historical Price Update

on:
  # Scheduled production updates run on the NAS runner (nas-job; see deploy/README.md).
  # Keep this workflow as a manual verification/fallback runner.
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Re-download all data from Jul 2003'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            python -m src.main --full-refresh
          else
            python -m src.main
          fi

      - name: Validate outputs
        run: python tests/validate_outputs.py

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            data_month="$(awk -F, 'NR == 1 { for (i = 1; i <= NF; i++) if ($i == "year_month") c = i; next }
              c && $c > m { m = $c } END { print m }' outputs/summary.csv)"
            git commit -m "Update historical price analysis ${data_month:-$(date +%Y-%m)}"
            git push
          fi

  # Upload and deploy run in separate jobs, and deploy retries twice: deploy-pages looks the
  # artifact up by name, and that lookup can come back empty right after the upload
  # (actions/deploy-pages#451). A failed lookup creates no deployment, so a retry is safe.
  # If all three tries fail, start a fresh run (workflow_dispatch). "Re-run all jobs" uploads a
  # second "github-pages" artifact and then fails on the duplicate.
  build-pages:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (includes any new outputs)
        run: git pull origin main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 3

  deploy-pages:
    needs: build-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the last retry
        if: steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
